# Supabase CLI 프로젝트 설정 파일.
#
# `supabase init`으로 생성되는 기본 구조를 바탕으로, 이번 단계
# (Edge Function 준비)에 필요한 항목만 포함했다. Auth/Database/Storage
# 등 이번 작업 범위에 포함되지 않는 기능은 별도로 활성화하지 않는다.

project_id = "ason-space"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[edge_runtime]
enabled = true
# 로컬(`supabase functions serve`) 실행 시 Edge Function이 사용할
# Deno 런타임 정책.
policy = "oneshot"

# SPACE SHIFT의 AI 인테리어 생성 요청을 받는 기본 Edge Function.
[functions.generate-interior]
# 이번 단계에서는 인증 없이도 로컬에서 쉽게 호출/테스트할 수 있도록
# verify_jwt를 꺼 둔다. 실제 서비스에 적용할 때는 앱 자체 인증
# (Supabase Auth 등)과 연계해 true로 바꾸는 것을 권장한다.
verify_jwt = false

# 무료 예상견적 요청을 접수하는 Edge Function.
[functions.submit-estimate]
verify_jwt = false

# 현장미팅 문의를 접수하는 Edge Function.
[functions.submit-site-meeting]
verify_jwt = false

# GPT FLOORPLAN WO — 업로드된 평면도를 GPT Vision으로 구조 이해하는
# Edge Function. OpenAI Secret(OPENAI_API_KEY)은 이 함수 환경에만 저장한다.
# V1 AI-IMAGE FLOW WO — 방향 수정으로 production 화면에서는 더 이상
# 호출하지 않지만(아래 gpt-floorplan-cad-image로 대체), R&D/대체 경로로
# 배포 상태를 유지한다(삭제하지 않는다).
[functions.gpt-floorplan-understand]
verify_jwt = false

# V1 AI-IMAGE FLOW WO — 원본 평면도 사진을 GPT(gpt-image-1)로 "깨끗한
# CAD 스타일 2D 평면도 이미지"로 다시 그리는 production Edge Function.
[functions.gpt-floorplan-cad-image]
verify_jwt = false
